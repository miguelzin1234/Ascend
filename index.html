.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.top h1{font-size:22px;letter-spacing:.12em;color:var(--gold2)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.ic{background:var(--glass);border:1px solid var(--bd);border-radius:50%;width:40px;height:40px}
.hero{text-align:center}.hero svg{width:100%;height:auto;display:block}
.title{font-family:Cinzel,serif;font-size:26px;color:var(--gold2)}
.sub{color:var(--mut);font-size:14px}
.bar{height:10px;border-radius:9px;background:rgba(127,140,170,.25);overflow:hidden;margin:8px 0 4px}

.m:last-child{border:0}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--gold);flex:none;display:grid;place-items:center}
.m.done .ck{background:var(--gold);color:#05070d}.m.done .t{opacity:.55}
.xp{margin-left:auto;color:var(--gold2);font-size:13px;white-space:nowrap;text-align:right}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid button,.chip{background:var(--glass);border:1px solid var(--bd);border-radius:14px;padding:12px 4px;text-align:center}
.grid button.on{background:var(--gold);color:#05070d}

.btn{background:linear-gradient(90deg,var(--gold),var(--gold2));color:#05070d;border:0;border-radius:12px;padding:12px 18px;font-weight:600}
.ghost{background:none;border:1px solid var(--bd);border-radius:12px;padding:8px 14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
.cal div{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-size:12px;background:rgba(127,140,170,.18);color:var(--mut)}
.cal .h{background:none;aspect-ratio:auto}.cal .g{background:var(--gold);color:#05070d}.cal .v{background:#2e9d62;color:#fff}.cal .t{outline:2px solid var(--gold2)}
.cn{display:flex;justify-content:space-between;align-items:center}
.item{display:flex;gap:8px;justify-content:space-between;border-bottom:1px solid rgba(127,140,170,.2);padding:9px 0}
.item small{color:var(--mut);display:block}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mem button{aspect-ratio:1;font-size:26px;background:var(--glass);border:1px solid var(--bd);border-radius:12px}
.mem button.ok{background:var(--gold)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 40%)}
nav div{display:flex;width:100%;max-width:560px;background:var(--glass);border:1px solid var(--bd);border-radius:22px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:4px}

nav button.on{background:rgba(217,174,86,.18);color:var(--gold2)}nav span{display:block;font-size:19px}
.thb{background:none;border:0;padding:0;flex:none;cursor:zoom-in}.thb img{width:56px;display:block;border-radius:10px;border:1px solid var(--bd)}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:grid;place-items:center;z-index:20;padding:16px;cursor:zoom-out}.lb img{max-width:min(92vw,460px);max-height:88vh;border-radius:14px}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-90px);background:var(--gold);color:#05070d;padding:10px 18px;border-radius:30px;font-weight:600;transition:.4s;z-index:9;text-align:center}
.toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
